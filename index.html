<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicBox</title>

    <style>
        /* ===== فونت اسپاتیفای ===== */
        @font-face {
            font-family: 'SpotifyMix';
            src: url('SpotifyMix-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        @font-face {
            font-family: 'SpotifyMix';
            src: url('SpotifyMix-Black.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* ===== تنظیمات کلی ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SpotifyMix', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            padding: 20px;
            position: relative;
        }

        /* ===== پس‌زمینه بلور ===== */
        .blur-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('covers/ptsd.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.4);
            transform: scale(1.1);
            z-index: 0;
            animation: bgFade 1.5s ease forwards;
            transition: background-image 0.8s ease;
        }

        @keyframes bgFade {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* ===== کارت اصلی ===== */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 30px 25px 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            animation: cardSlideUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes cardSlideUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== هدر ===== */
        .app-header {
            text-align: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0;
            animation: fadeUp 0.8s ease forwards;
            animation-delay: 0.3s;
        }

        .app-name {
            color: #fff;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        /* ===== کاور آهنگ ===== */
        .cover-wrapper {
            opacity: 0;
            transform: scale(0.92);
            animation: coverZoom 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.5s;
        }

        @keyframes coverZoom {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cover-wrapper img {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1/1;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: block;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .cover-wrapper img:hover {
            transform: scale(1.01);
        }

        /* ===== اطلاعات آهنگ ===== */
        .song-info {
            margin-top: 18px;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUp 0.8s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .song-info h1 {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .song-info p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            margin-top: 4px;
            letter-spacing: 0px;
        }

        /* ===== کنترل‌ها ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 8px 0 14px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'SpotifyMix', sans-serif;
        }

        .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        /* ===== دکمه پخش ===== */
        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #000;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            text-align: center;
            text-indent: 3px;
            position: relative;
            font-family: 'SpotifyMix', sans-serif;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 255, 255, 0.25);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.playing-btn {
            text-indent: 0;
        }

        .play-btn.pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            }

            50% {
                box-shadow: 0 4px 35px rgba(255, 255, 255, 0.3);
            }
        }

        /* ===== نوار زمان ===== */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .progress-container span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 400;
            min-width: 36px;
            letter-spacing: 0.3px;
            font-family: 'SpotifyMix', sans-serif;
        }

        .progress-bar {
            flex: 1;
            height: 3px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            position: relative;
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 5px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: #ffffff;
            transition: width 0.1s linear;
        }

        /* ===== لیست پخش ===== */
        .playlist-section {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }

        .playlist-header {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
            font-family: 'SpotifyMix', sans-serif;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-family: 'SpotifyMix', sans-serif;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .playlist-item .playlist-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .playlist-item .playlist-artist {
            font-size: 11px;
            opacity: 0.5;
            font-weight: 400;
        }

        .playlist-item .play-indicator {
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .playlist-item.active .play-indicator {
            opacity: 1;
        }

        .playlist-section::-webkit-scrollbar {
            width: 3px;
        }

        .playlist-section::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .playlist-section::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .playing .cover-wrapper img {
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05), 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px 15px 22px;
                border-radius: 22px;
            }

            .app-name {
                font-size: 30px;
            }

            .song-info h1 {
                font-size: 19px;
            }

            .song-info p {
                font-size: 13px;
            }

            .play-btn {
                width: 56px;
                height: 56px;
                font-size: 24px;
                text-indent: 2px;
            }
        }
    </style>
</head>

<body>

    <div class="blur-bg" id="blurBg"></div>

    <div class="card" id="playerCard">

        <!-- ===== هدر ===== -->
        <div class="app-header">
            <div class="app-name">MusicBox</div>
        </div>

        <div class="cover-wrapper">
            <img src="covers/ptsd.jpg" alt="Cover" id="coverImage">
        </div>

        <div class="song-info">
            <h1 id="songTitle">PTSD</h1>
            <p id="songArtist">Nemzzz</p>
        </div>

        <div class="player">
            <div class="controls">
                <button class="nav-btn" id="prevBtn">⏮</button>
                <button class="play-btn" id="playBtn">▶</button>
                <button class="nav-btn" id="nextBtn">⏭</button>
            </div>

            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- ===== لیست پخش ===== -->
        <div class="playlist-section">
            <div class="playlist-header">My Songs</div>
            <div id="playlistContainer"></div>
        </div>

    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        // ============================================
        // Your Songs - Add your music here
        // ============================================
        const songs = [{
            id: 1,
            title: "KILLIN EM",
            artist: "Nemzzz",
            cover: "covers/KILLIN EM .jpg",
            src: "songs/KILLIN EM   Nemzzz.m4a"
        }
        , {
            id: 2,
            title: "ME V ME",
            artist: "Kidwild",
            cover: "covers/mevme.jpg",
            src: "songs/mevme.m4a"
        }
        , {
            id: 3,
            title: "PTSD",
            artist: "Nemzzz",
            cover: "covers/cover.jpg",
            src: "songs/ptsd.m4a"
        }
        , {
            id: 4,
            title: "8PM",
            artist: "Nemzzz",
            cover: "covers/8pm.jpg",
            src: "songs/8PM   Nemzzz.m4a"
        }
        , {
            id: 5,
            title: "ANNIHILATE",
            artist: "Metro Boomin",
            cover: "covers/spiderman.jpg",
            src: "songs/Annihilate.m4a"
        }
        , {
            id: 6,
            title: "COLD",
            artist: "Nemzzz",
            cover: "covers/COLD   Nemzzz.jpg",
            src: "songs/COLD   Nemzzz.m4a"
        }
        , {
            id: 7,
            title: "HAS TO BE YOU",
            artist: "Kidwild",
            cover: "covers/has to be you 2   Kidwild   Thiago Sub.jpg",
            src: "songs/has to be you 2   Kidwild   Thiago Sub.m4a"
        }
   
    
    ];
        // ============================================

        // ===== Elements =====
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const coverImage = document.getElementById('coverImage');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const blurBg = document.getElementById('blurBg');
        const card = document.getElementById('playerCard');

        let currentIndex = 0;
        let isPlaying = false;

        // ===== Render Playlist =====
        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';

            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.dataset.index = index;

                item.innerHTML = `
                    <div class="playlist-info">
                        <span class="playlist-title-text">${song.title}</span>
                        <span class="playlist-artist">${song.artist}</span>
                    </div>
                    <span class="play-indicator">▶</span>
                `;

                item.addEventListener('click', () => {
                    playSong(index);
                });

                container.appendChild(item);
            });
        }

        // ===== Load Song =====
        function loadSong(index) {
            const song = songs[index];

            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            coverImage.src = song.cover;
            blurBg.style.backgroundImage = `url('${song.cover}')`;

            audio.src = song.src;
            audio.load();

            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        }

        // ===== Play Song =====
        function playSong(index) {
            if (index === currentIndex && isPlaying) {
                return;
            }

            currentIndex = index;
            loadSong(index);
            audio.play().catch(() => { });
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing-btn', 'pulse');
            card.classList.add('playing');
            isPlaying = true;
        }

        // ===== Next Song =====
        function nextSong() {
            const nextIndex = (currentIndex + 1) % songs.length;
            playSong(nextIndex);
        }

        // ===== Previous Song =====
        function prevSong() {
            const prevIndex = (currentIndex - 1 + songs.length) % songs.length;
            playSong(prevIndex);
        }

        // ===== Events =====
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing-btn', 'pulse');
                card.classList.remove('playing');
            } else {
                audio.play().catch(() => { });
                playBtn.textContent = '⏸';
                playBtn.classList.add('playing-btn', 'pulse');
                card.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const percent = clickX / width;
            audio.currentTime = percent * audio.duration;
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        // ===== Format Time =====
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        // ===== Double Click on Card =====
        card.addEventListener('dblclick', () => {
            playBtn.click();
        });

        // ===== Start with first song =====
        renderPlaylist();
        loadSong(0);

        console.log('MusicBox is ready!');
    </script>

</body>

</html>
